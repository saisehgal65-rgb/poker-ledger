<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Poker Ledger</title>
<meta name="description" content="Standings, nights and settle-ups for our poker games.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23fff' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Black, minimal: white type on pure black, hairline dividers, colour only where it carries meaning (win/loss, player lines). */
:root{
  color-scheme:dark;
  --bg:#000; --surface:#0a0a0a; --surface2:#141414; --fg:#f5f5f5; --muted:#8b8b8b; --faint:#5a5a5a;
  --line:#1c1c1c; --line2:#2a2a2a;
  --accent:#fafafa; --on-accent:#000; --brass:#fafafa;
  --win:#4ade80; --loss:#f87171;
  --c0:#e5e5e5; --c1:#fb923c; --c2:#60a5fa; --c3:#e879f9; --c4:#facc15; --c5:#22d3ee; --c6:#fb7185; --c7:#a3e635; --c8:#94a3b8; --c9:#a78bfa;
  --f-display:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:920px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:48px 96px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
::selection{background:#fff;color:#000}
:focus-visible{outline:1.5px solid var(--fg);outline-offset:2px;border-radius:6px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13.5px}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px 24px;flex-wrap:wrap}
.top h1{margin:0;font-family:var(--f-display);font-weight:600;font-size:clamp(2rem,6vw,2.75rem);line-height:1;letter-spacing:-.035em}
.kicker{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;font-family:var(--f-mono)}
.sync{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--win);display:inline-block;box-shadow:0 0 0 3px rgba(74,222,128,.15)}
.sync.off i{background:var(--muted);box-shadow:none}

nav.tabs{display:flex;gap:4px;margin:40px 0 36px;overflow-x:auto;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;width:max-content;max-width:100%}
nav.tabs button{background:none;border:0;padding:7px 16px;border-radius:999px;font-weight:500;font-size:14px;color:var(--muted);white-space:nowrap;transition:color .15s,background .15s}
nav.tabs button:hover{color:var(--fg)}
nav.tabs button[aria-current="page"]{color:var(--on-accent);background:var(--accent)}

h2{font-family:var(--f-mono);font-weight:500;font-size:12px;letter-spacing:.08em;margin:0 0 16px;text-transform:uppercase;color:var(--muted)}
h3{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;font-weight:500}
.section{margin-top:56px}
.hint{color:var(--muted);margin:8px 0}
.banner{border:1px solid var(--line2);background:var(--surface);border-radius:12px;padding:12px 16px;margin:24px 0 0;display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.banner button{background:none;border:0;text-decoration:underline;color:var(--muted);padding:0}

.btn{background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);border-radius:999px;padding:8px 18px;font-weight:500;font-size:14px;min-height:38px;transition:opacity .15s,background .15s,border-color .15s}
.btn:hover{opacity:.88}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line2)}
.btn.ghost:hover{border-color:var(--muted);opacity:1}
.btn.danger{background:transparent;color:var(--loss);border-color:rgba(248,113,113,.35)}
.btn.sm{padding:4px 12px;min-height:30px;font-size:13px}
.btn:disabled{opacity:.35;cursor:default}
.ro .edit{display:none!important}

input[type=text],input[type=number],input[type=date],input[type=email],input[type=password]{background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:8px 12px;min-height:40px;max-width:100%;transition:border-color .15s}
input:focus{outline:none;border-color:var(--fg)}
input::placeholder{color:var(--faint)}
input[type=number]{font-family:var(--f-mono);width:7.5rem}
input:disabled{opacity:.6}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.stat{background:var(--bg);padding:20px 20px 18px;min-width:0}
.stat .v{font-family:var(--f-display);font-weight:600;font-size:1.9rem;line-height:1.1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat .l{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.stat .s{font-size:13px;color:var(--faint);overflow-wrap:anywhere;margin-top:2px}
@media (max-width:680px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:600px}
th{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);text-align:right;font-weight:500;padding:0 12px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:14px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
tbody tr{transition:background .15s}
tbody tr:hover{background:var(--surface)}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}
th:first-child,td:first-child{padding-left:4px}
td.pl{font-weight:500}
td.rank{width:2.4rem;color:var(--faint);font-family:var(--f-mono);font-size:13px}
tr.first td.rank{color:var(--fg)}
td.big{font-family:var(--f-mono);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.pos{color:var(--win)} .neg{color:var(--loss)} .zero{color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc,var(--muted));margin-right:10px;flex:none;vertical-align:1px}

.chartbox{border:1px solid var(--line);border-radius:16px;background:var(--bg);padding:16px 12px 8px}
.chartbox svg{display:block;min-width:600px;width:100%;height:auto}
.chartbox text{font-family:var(--f-mono)}

.empty{border:1px dashed var(--line2);border-radius:16px;padding:32px 28px}
.empty h2{margin-bottom:8px}
.empty ol{margin:12px 0 20px;padding-left:1.2rem;color:var(--muted)}
.empty .row{display:flex;gap:10px;flex-wrap:wrap}

.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.bar h2{margin:0!important}
.nrow{display:grid;grid-template-columns:1fr auto;gap:4px 16px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:18px 4px;margin:0;transition:background .15s}
.nrow:first-of-type{border-top:1px solid var(--line)}
.nrow:hover{background:var(--surface)}
.nrow .d{font-weight:500}
.nrow .m{color:var(--muted);font-size:13px;grid-column:1;font-family:var(--f-mono)}
.nrow .r{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:4px;justify-content:center}
.pill{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;font-weight:500;border-radius:999px;padding:3px 10px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--win);border-color:rgba(74,222,128,.3)}
.pill.warn{color:var(--loss);border-color:rgba(248,113,113,.3)}
.pill.live{color:var(--fg);border-color:var(--muted)}

.meta{display:flex;gap:16px 20px;flex-wrap:wrap;align-items:flex-end;margin-bottom:24px}
.meta label{display:flex;flex-direction:column;gap:6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.meta label input{font-family:var(--f-body);letter-spacing:0;text-transform:none;color:var(--fg);font-size:15px}
.meta label.grow{flex:1 1 220px}
.meta label.grow input{width:100%}

.prow{display:grid;grid-template-columns:minmax(120px,1fr) minmax(0,2.4fr) 70px 150px 90px 36px;grid-template-areas:"name chips in cash net rm";gap:8px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:8px}
.prow .pname{grid-area:name;font-weight:500;display:flex;align-items:center;min-width:0;overflow-wrap:anywhere}
.prow .chips{grid-area:chips;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.prow .in{grid-area:in;font-family:var(--f-mono);font-size:13.5px;font-variant-numeric:tabular-nums;text-align:right;color:var(--muted)}
.prow .cash{grid-area:cash;display:flex;gap:6px;align-items:center;justify-content:flex-end}
.prow .cash input{width:6.4rem}
.prow .netc{grid-area:net;text-align:right;font-family:var(--f-mono);font-weight:600;font-size:15px;line-height:1}
.prow .rm{grid-area:rm}
.prow .lbl{display:none;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.chip{font-family:var(--f-mono);font-size:12.5px;background:var(--surface2);border:1px solid var(--line2);border-radius:999px;padding:3px 6px 3px 11px;display:inline-flex;gap:4px;align-items:center}
.x{background:none;border:0;color:var(--faint);font-size:20px;line-height:1;padding:4px 8px;border-radius:6px}
.x:hover{color:var(--loss)}
@media (max-width:680px){
  .wrap{padding-block:32px 72px}
  .prow{grid-template-columns:1fr auto auto;grid-template-areas:"name net rm" "chips chips chips" "in cash cash"}
  .prow .lbl{display:inline;margin-right:6px}
  .prow .in{text-align:left}
  th,td{padding-left:8px;padding-right:8px}
  nav.tabs{margin:32px 0 28px}
  .section{margin-top:44px}
}

.seat{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seat .add{display:flex;gap:8px;flex-wrap:wrap}
.tot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:4px 0 24px}
.tot>div{background:var(--bg);padding:16px 18px;min-width:0}
.tot .v{font-family:var(--f-display);font-weight:600;font-size:1.6rem;line-height:1.1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tot .l{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.tot .v.t{font-size:15px;font-weight:500;letter-spacing:0;line-height:1.35;padding-top:4px}
@media (max-width:560px){.tot{grid-template-columns:1fr 1fr}.tot>div:last-child{grid-column:1/-1}}
ul.settle{list-style:none;padding:0;margin:0;display:flex;flex-direction:column}
ul.settle li{border-bottom:1px solid var(--line);padding:14px 4px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
ul.settle li:first-child{border-top:1px solid var(--line)}
ul.settle b{font-weight:500}
.pr{display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:10px 4px;flex-wrap:wrap}
.pr:first-of-type{border-top:1px solid var(--line)}
.pr .pn{flex:1 1 180px;min-width:0}
.pr .pn input{width:100%;background:transparent;border-color:transparent}
.pr .pn input:hover:not(:disabled){border-color:var(--line2)}
.pr .pn input:focus{border-color:var(--fg)}
.pr .pn input:disabled{opacity:1}
.pr .c{color:var(--muted);font-size:13px;min-width:6rem;font-family:var(--f-mono)}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.addrow input{flex:1 1 200px}

.login{max-width:380px;display:flex;flex-direction:column;gap:16px}
.login label{display:flex;flex-direction:column;gap:6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.login input{width:100%;font-family:var(--f-body);text-transform:none;letter-spacing:0;color:var(--fg);font-size:15px}
.login .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:4px}
.login-title{font-family:var(--f-display);font-size:1.6rem;font-weight:600;letter-spacing:-.03em;margin:0 0 6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap"><div id="app"><p class="hint">Loading the ledger…</p></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
