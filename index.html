<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Poker Ledger</title>
<meta name="description" content="Standings, nights and settle-ups for our poker games.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%231c5b49'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23e0b45a' stroke-width='3' stroke-dasharray='4 3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column, a tabbed ledger. Felt-green palette with brass highlights, mono figures like a chip count. */
:root{
  color-scheme:light;
  --bg:#eef1ec; --surface:#fbfcfa; --surface2:#e3e9e1; --fg:#14201b; --muted:#566860; --line:#cdd7cf;
  --accent:#1c5b49; --on-accent:#ffffff; --brass:#8f6310;
  --win:#1b7a4b; --loss:#b4382f;
  --c0:#1f6f5c; --c1:#c2410c; --c2:#2563eb; --c3:#a21caf; --c4:#a16207; --c5:#0e7490; --c6:#be123c; --c7:#4d7c0f; --c8:#475569; --c9:#7c3aed;
  --f-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --f-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1a15; --surface:#15251e; --surface2:#1d3028; --fg:#e8efe9; --muted:#9bb0a4; --line:#2a4036;
    --accent:#4fb08f; --on-accent:#06201a; --brass:#e0b45a; --win:#55d38e; --loss:#ff8a7a;
    --c0:#4fb08f; --c1:#fb923c; --c2:#6ea8ff; --c3:#e879f9; --c4:#facc15; --c5:#22d3ee; --c6:#fb7185; --c7:#a3e635; --c8:#94a3b8; --c9:#a78bfa;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 72px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 24px;flex-wrap:wrap}
.top h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(2.4rem,8vw,3.8rem);line-height:.95;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.sync{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--win);display:inline-block}
.sync.off i{background:var(--brass)}

nav.tabs{display:flex;gap:4px;margin:22px 0 22px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;margin-bottom:-1px;font-weight:600;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--fg);border-bottom-color:var(--brass)}

h2{font-family:var(--f-display);font-weight:700;font-size:1.7rem;letter-spacing:.02em;margin:0 0 12px;text-transform:uppercase}
h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600}
.section{margin-top:34px}
.hint{color:var(--muted);margin:8px 0}
.banner{border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:10px 12px;margin-bottom:16px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.banner button{background:none;border:0;text-decoration:underline;color:var(--muted);padding:0}

.btn{background:var(--accent);color:var(--on-accent);border:1px solid transparent;border-radius:6px;padding:8px 14px;font-weight:600;min-height:38px}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.danger{background:transparent;color:var(--loss);border-color:var(--loss)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.ro .edit{display:none!important}

input[type=text],input[type=number],input[type=date],input[type=email],input[type=password]{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-height:38px;max-width:100%}
input[type=number]{font-family:var(--f-mono);width:7.5rem}
input:disabled{opacity:.7}

.stats{display:flex;flex-wrap:wrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{flex:1 1 150px;padding:14px 16px 14px 0;min-width:0}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:2rem;line-height:1.05}
.stat .l{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}

.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}
td.pl{font-weight:600}
td.rank{width:2.2rem;color:var(--muted);font-family:var(--f-mono)}
tr.first td.rank{color:var(--brass);font-weight:700}
td.big{font-family:var(--f-display);font-weight:700;font-size:1.5rem;letter-spacing:.01em}
.pos{color:var(--win)} .neg{color:var(--loss)} .zero{color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--pc,var(--muted));margin-right:8px;flex:none}

.chartbox{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:10px}
.chartbox svg{display:block;min-width:600px;width:100%;height:auto}
.chartbox text{font-family:var(--f-mono)}

.empty{border:1px dashed var(--line);border-radius:8px;padding:26px 22px}
.empty h2{margin-bottom:8px}
.empty ol{margin:12px 0 18px;padding-left:1.2rem;color:var(--muted)}
.empty .row{display:flex;gap:10px;flex-wrap:wrap}

.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.nrow{display:grid;grid-template-columns:1fr auto;gap:2px 14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:8px}
.nrow:hover{border-color:var(--muted)}
.nrow .d{font-weight:600}
.nrow .m{color:var(--muted);font-size:13px;grid-column:1}
.nrow .r{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:4px;justify-content:center}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;border:1px solid var(--line);white-space:nowrap}
.pill.ok{color:var(--win);border-color:var(--win)}
.pill.warn{color:var(--loss);border-color:var(--loss)}
.pill.live{color:var(--brass);border-color:var(--brass)}

.meta{display:flex;gap:14px 18px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px}
.meta label{display:flex;flex-direction:column;gap:4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.meta label.grow{flex:1 1 220px}
.meta label.grow input{width:100%}

.prow{display:grid;grid-template-columns:minmax(120px,1fr) minmax(0,2.4fr) 70px 150px 90px 36px;grid-template-areas:"name chips in cash net rm";gap:8px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:8px}
.prow .pname{grid-area:name;font-weight:600;display:flex;align-items:center;min-width:0;overflow-wrap:anywhere}
.prow .chips{grid-area:chips;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.prow .in{grid-area:in;font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.prow .cash{grid-area:cash;display:flex;gap:6px;align-items:center;justify-content:flex-end}
.prow .cash input{width:6.4rem}
.prow .netc{grid-area:net;text-align:right;font-family:var(--f-display);font-weight:700;font-size:1.5rem;line-height:1}
.prow .rm{grid-area:rm}
.prow .lbl{display:none;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-family:var(--f-body)}
.chip{font-family:var(--f-mono);font-size:13px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px 8px 3px 11px;display:inline-flex;gap:7px;align-items:center}
.x{background:none;border:0;color:var(--muted);font-size:20px;line-height:1;padding:4px 8px;border-radius:6px}
.x:hover{color:var(--loss)}
@media (max-width:680px){
  .prow{grid-template-columns:1fr auto auto;grid-template-areas:"name net rm" "chips chips chips" "in cash cash"}
  .prow .lbl{display:inline;margin-right:6px}
  .prow .in{text-align:left}
  th,td{padding-left:8px;padding-right:8px}
}

.seat{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seat .add{display:flex;gap:8px;flex-wrap:wrap}
.tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:4px 0 18px}
.tot div{padding:12px 14px 12px 0;min-width:0}
.tot .v{font-family:var(--f-display);font-weight:700;font-size:1.8rem;line-height:1.05}
.tot .l{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tot .v.t{font-size:1.05rem;font-family:var(--f-body);font-weight:600;line-height:1.3;padding-top:4px}
ul.settle{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
ul.settle li{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pr{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:8px;flex-wrap:wrap}
.pr .pn{flex:1 1 180px;min-width:0}
.pr .pn input{width:100%}
.pr .c{color:var(--muted);font-size:13px;min-width:6rem}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.addrow input{flex:1 1 200px}

.login{max-width:380px;display:flex;flex-direction:column;gap:12px}
.login label{display:flex;flex-direction:column;gap:4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.login input{width:100%}
.login .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap"><div id="app"><p class="hint">Loading the ledger…</p></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
